volumes:
  redis-data:

networks:
  elixir-net:
    driver: bridge

services:
  elixir-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elixir-backend
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - elixir-net

  redis:
    image: redis:latest
    container_name: redis
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    networks:
      - elixir-net